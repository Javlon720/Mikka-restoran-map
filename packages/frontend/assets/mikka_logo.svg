<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="32" height="32" class="logo-svg">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" /> <!-- Amber -->
      <stop offset="100%" stop-color="#ef4444" /> <!-- Red-orange -->
    </linearGradient>
  </defs>
  <!-- Outer glowing soft ring -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="url(#logo-grad)" stroke-width="6" stroke-linecap="round" opacity="0.9" />
  <!-- The letter "m" styled as three beautiful vertical arches, representing restaurant arches/steam/plates -->
  <path d="M36,75 V50 C36,38 46,38 46,50 V75 M46,50 C46,38 56,38 56,50 V75 M56,50 C56,38 66,38 66,50 V75" 
        fill="none" stroke="url(#logo-grad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- A small star of review next to it -->
  <path d="M82,42 L84.5,47.5 L90.5,48.2 L86,52.2 L87.3,58.2 L82,55.1 L76.7,58.2 L78,52.2 L73.5,48.2 L79.5,47.5 Z" 
        fill="#f59e0b" />
</svg>
